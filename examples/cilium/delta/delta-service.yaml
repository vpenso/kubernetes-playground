apiVersion: apps/v1
kind: Deployment
metadata:
  name: delta-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: delta-nginx
  template:
    metadata:
      labels:
        app: delta-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.31-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: delta-service
spec:
  type: LoadBalancer
  selector:
    app: delta-nginx
  ports:
  - port: 80
    targetPort: 80

