<svg viewBox="0 0 1100 580" xmlns="http://www.w3.org/2000/svg"
     font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="delta-hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <marker id="sd-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700"
        fill="#0f172a">L2 Announcements &amp; ARP</text>
  <text x="550" y="64" text-anchor="middle" font-size="14"
        fill="#475569">control-plane answers ARP for the LB IP · eBPF load balances to pods on the workers</text>

  <!-- ============ host (external client) ============ -->
  <rect x="40" y="200" width="220" height="130" rx="10"
        fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.55"/>
  <text x="60" y="226" font-size="14.5" font-weight="700"
        fill="#0c4a6e">Host</text>
  <text x="60" y="250" font-size="12.5" fill="#475569">client · curl :80</text>
  <text x="60" y="272" font-size="12.5" fill="#475569">ARP: who has 172.19.255.200?</text>
  <text x="60" y="294" font-size="12.5" fill="#475569">learns MAC 02:86:fa:c4:d7:9f</text>

  <!-- ============ kind cluster container ============ -->
  <rect x="460" y="110" width="620" height="410" rx="14"
        fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="480" y="136" font-size="12" font-weight="700" letter-spacing="2"
        fill="#10b981">KIND CLUSTER · DELTA · 172.19.0.0/16</text>

  <!-- delta-control-plane (hero, lease holder) -->
  <rect x="490" y="160" width="250" height="150" rx="12"
        fill="url(#delta-hero)" stroke="#8b5cf6" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="512" y="186" font-size="14.5" font-weight="700"
        fill="#4c1d95">delta-control-plane <tspan fill="#8b5cf6" font-size="11.5">· 172.19.0.3</tspan></text>
  <line x1="512" y1="198" x2="718" y2="198" stroke="#8b5cf6" stroke-opacity="0.35"/>
  <text x="512" y="222" font-size="12.5" fill="#6d28d9">cilium-agent · holds L2 lease</text>
  <text x="512" y="244" font-size="12.5" fill="#475569">answers ARP on eth0</text>
  <text x="512" y="266" font-size="12.5" fill="#475569">MAC 02:86:fa:c4:d7:9f</text>
  <text x="512" y="288" font-size="12.5" fill="#475569">eBPF LB · 172.19.255.200:80</text>

  <!-- worker nodes with their nginx pod -->
  <g>
    <rect x="810" y="160" width="250" height="90" rx="10"
          fill="#ecfdf5" stroke="#10b981" stroke-opacity="0.55"/>
    <g transform="translate(830,170)">
      <circle cx="5" cy="4" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
      <circle cx="13" cy="4" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
      <circle cx="5" cy="12" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
      <circle cx="13" cy="12" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
    </g>
    <text x="856" y="186" font-size="13.5" font-weight="700"
          fill="#065f46">delta-worker3 <tspan fill="#10b981" font-size="11">· 172.19.0.4</tspan></text>
    <text x="856" y="210" font-size="11.5" fill="#475569">MAC 56:a4:1e:5b:70:a6</text>
    <text x="856" y="232" font-size="11.5" fill="#475569">nginx · 10.244.1.181:80</text>

    <rect x="810" y="280" width="250" height="90" rx="10"
          fill="#ecfdf5" stroke="#10b981" stroke-opacity="0.55"/>
    <g transform="translate(830,290)">
      <circle cx="5" cy="4" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
      <circle cx="13" cy="4" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
      <circle cx="5" cy="12" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
      <circle cx="13" cy="12" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
    </g>
    <text x="856" y="306" font-size="13.5" font-weight="700"
          fill="#065f46">delta-worker2 <tspan fill="#10b981" font-size="11">· 172.19.0.2</tspan></text>
    <text x="856" y="330" font-size="11.5" fill="#475569">MAC 7e:5b:99:40:1d:3c</text>
    <text x="856" y="352" font-size="11.5" fill="#475569">nginx · 10.244.2.77:80</text>

    <rect x="810" y="400" width="250" height="90" rx="10"
          fill="#ecfdf5" stroke="#10b981" stroke-opacity="0.55"/>
    <g transform="translate(830,410)">
      <circle cx="5" cy="4" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
      <circle cx="13" cy="4" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
      <circle cx="5" cy="12" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
      <circle cx="13" cy="12" r="2.5" fill="#99f6e4" stroke="#0d9488" stroke-opacity="0.7"/>
    </g>
    <text x="856" y="426" font-size="13.5" font-weight="700"
          fill="#065f46">delta-worker <tspan fill="#10b981" font-size="11">· 172.19.0.5</tspan></text>
    <text x="856" y="450" font-size="11.5" fill="#475569">MAC 6a:58:37:b4:9b:24</text>
    <text x="856" y="472" font-size="11.5" fill="#475569">nginx · 10.244.3.101:80</text>
  </g>

  <!-- ============ flow ============ -->
  <!-- 1: ARP request host -> control-plane -->
  <line x1="264" y1="215" x2="484" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#sd-arrow)"/>
  <circle cx="374" cy="215" r="11" fill="#0284c7"/>
  <text x="374" y="219" text-anchor="middle" font-size="12" font-weight="700"
        fill="#ffffff">1</text>
  <text x="354" y="205" text-anchor="end" font-size="11.5"
        fill="#475569">ARP request</text>

  <!-- 2: ARP reply control-plane -> host -->
  <line x1="486" y1="240" x2="266" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#sd-arrow)"/>
  <circle cx="376" cy="240" r="11" fill="#8b5cf6"/>
  <text x="376" y="244" text-anchor="middle" font-size="12" font-weight="700"
        fill="#ffffff">2</text>
  <text x="356" y="230" text-anchor="end" font-size="11.5"
        fill="#475569">ARP reply</text>

  <!-- 3: HTTP host -> control-plane (LB IP) -->
  <line x1="264" y1="300" x2="484" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#sd-arrow)"/>
  <circle cx="374" cy="300" r="11" fill="#6366f1"/>
  <text x="374" y="304" text-anchor="middle" font-size="12" font-weight="700"
        fill="#ffffff">3</text>
  <text x="354" y="290" text-anchor="end" font-size="11.5"
        fill="#475569">HTTP :80</text>

  <!-- 4: eBPF -> pods on the workers (trunk + ticks) -->
  <path d="M 742 235 L 782 235" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="782" y1="205" x2="782" y2="445" stroke="#475569" stroke-width="2"/>
  <line x1="784" y1="205" x2="804" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#sd-arrow)"/>
  <line x1="784" y1="325" x2="804" y2="325" stroke="#475569" stroke-width="2" marker-end="url(#sd-arrow)"/>
  <line x1="784" y1="445" x2="804" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#sd-arrow)"/>
  <circle cx="782" cy="265" r="11" fill="#10b981"/>
  <text x="782" y="269" text-anchor="middle" font-size="12" font-weight="700"
        fill="#ffffff">4</text>

  <!-- ============ legend ============ -->
  <g font-size="11.5" fill="#475569">
    <circle cx="70" cy="550" r="11" fill="#0284c7"/>
    <text x="70" y="554" text-anchor="middle" font-size="12"
          font-weight="700" fill="#ffffff">1</text>
    <text x="89" y="554">ARP request</text>
    <circle cx="205" cy="550" r="11" fill="#8b5cf6"/>
    <text x="205" y="554" text-anchor="middle" font-size="12"
          font-weight="700" fill="#ffffff">2</text>
    <text x="224" y="554">ARP reply · node MAC</text>
    <circle cx="390" cy="550" r="11" fill="#6366f1"/>
    <text x="390" y="554" text-anchor="middle" font-size="12"
          font-weight="700" fill="#ffffff">3</text>
    <text x="409" y="554">HTTP :80 to LB IP</text>
    <circle cx="555" cy="550" r="11" fill="#10b981"/>
    <text x="555" y="554" text-anchor="middle" font-size="12"
          font-weight="700" fill="#ffffff">4</text>
    <text x="574" y="554">eBPF → pods on workers</text>
    <text x="1060" y="554" text-anchor="end" fill="#64748b">LB IP 172.19.255.200 · pool 172.19.255.200–250</text>
  </g>
</svg>
