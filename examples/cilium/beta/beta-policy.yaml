# L3/L4 + L7: client may only GET on server:80
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: beta-nginx-get-access
  namespace: demo
spec:
  endpointSelector: 
    matchLabels: 
      app: beta-nginx
  ingress:
  - fromEndpoints: 
     - matchLabels:
        app: beta-client
    toPorts:
    - ports: 
        - port: "80"
          protocol: TCP
      rules:
        http: 
          - method: "GET"
            path: "/"
