<svg viewBox="0 0 1160 560" xmlns="http://www.w3.org/2000/svg"
     font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="580" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Cilium WireGuard — Node to Node Traffic</text>
  <text x="580" y="64" text-anchor="middle" font-size="14" fill="#475569">Pod to pod across nodes · encryption runs in the Linux kernel</text>

  <!-- ================= NODE 1 ================= -->
  <rect x="20" y="90" width="480" height="350" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="40" y="114" font-size="12" font-weight="700" letter-spacing="2" fill="#10b981">NODE 1</text>

  <!-- Source pod -->
  <rect x="40" y="140" width="170" height="56" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.55"/>
  <text x="60" y="164" font-size="14.5" font-weight="700" fill="#0c4a6e">Source pod</text>
  <text x="60" y="186" font-size="12.5" fill="#475569">app on node 1</text>

  <!-- cilium-agent (userspace) -->
  <rect x="240" y="140" width="240" height="56" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-opacity="0.55"/>
  <text x="260" y="164" font-size="14.5" font-weight="700" fill="#4c1d95">cilium-agent <tspan fill="#8b5cf6" font-size="11.5">· userspace</tspan></text>
  <text x="260" y="186" font-size="12.5" fill="#475569">loads eBPF · key pair</text>

  <!-- Linux kernel container -->
  <rect x="40" y="250" width="440" height="170" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="60" y="272" font-size="12" font-weight="700" letter-spacing="2" fill="#475569">LINUX KERNEL</text>

  <!-- eBPF programs (in kernel) -->
  <rect x="60" y="288" width="190" height="56" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-opacity="0.55"/>
  <text x="80" y="312" font-size="14" font-weight="700" fill="#4c1d95">eBPF programs</text>
  <text x="80" y="334" font-size="12.5" fill="#6d28d9">routes to wg0</text>

  <!-- wg0 (in kernel) -->
  <rect x="280" y="288" width="180" height="56" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-opacity="0.55"/>
  <text x="300" y="312" font-size="14" font-weight="700" fill="#be123c">wg0 <tspan fill="#e11d48" font-size="11.5">· WireGuard</tspan></text>
  <text x="300" y="334" font-size="12.5" fill="#475569">encrypts in kernel</text>

  <text x="60" y="372" font-size="12" fill="#64748b">keys · encryption · rotation — all in kernel</text>

  <!-- Step 1: pod to kernel -->
  <line x1="125" y1="200" x2="125" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="125" cy="222" r="11" fill="#0284c7"/>
  <text x="125" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="139" y="226" font-size="11.5" fill="#475569">to remote pod IP</text>

  <!-- cilium-agent setup (dashed control) -->
  <line x1="360" y1="200" x2="360" y2="244" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <text x="374" y="226" font-size="11.5" fill="#6d28d9">loads eBPF · keys</text>

  <!-- Step 2: eBPF to wg0 -->
  <line x1="254" y1="316" x2="274" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="264" cy="316" r="11" fill="#8b5cf6"/>
  <text x="264" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>

  <!-- ================= NODE 2 ================= -->
  <rect x="660" y="90" width="480" height="350" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="680" y="114" font-size="12" font-weight="700" letter-spacing="2" fill="#10b981">NODE 2</text>

  <!-- cilium-agent (userspace) -->
  <rect x="680" y="140" width="240" height="56" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-opacity="0.55"/>
  <text x="700" y="164" font-size="14.5" font-weight="700" fill="#4c1d95">cilium-agent <tspan fill="#8b5cf6" font-size="11.5">· userspace</tspan></text>
  <text x="700" y="186" font-size="12.5" fill="#475569">loads eBPF · key pair</text>

  <!-- Target pod -->
  <rect x="950" y="140" width="170" height="56" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-opacity="0.55"/>
  <text x="970" y="164" font-size="14.5" font-weight="700" fill="#0c4a6e">Target pod</text>
  <text x="970" y="186" font-size="12.5" fill="#475569">app on node 2</text>

  <!-- Linux kernel container -->
  <rect x="680" y="250" width="440" height="170" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="700" y="272" font-size="12" font-weight="700" letter-spacing="2" fill="#475569">LINUX KERNEL</text>

  <!-- wg0 (in kernel, mirrored) -->
  <rect x="700" y="288" width="180" height="56" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-opacity="0.55"/>
  <text x="720" y="312" font-size="14" font-weight="700" fill="#be123c">wg0 <tspan fill="#e11d48" font-size="11.5">· WireGuard</tspan></text>
  <text x="720" y="334" font-size="12.5" fill="#475569">decrypts in kernel</text>

  <!-- eBPF programs (in kernel, mirrored) -->
  <rect x="910" y="288" width="190" height="56" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-opacity="0.55"/>
  <text x="930" y="312" font-size="14" font-weight="700" fill="#4c1d95">eBPF programs</text>
  <text x="930" y="334" font-size="12.5" fill="#6d28d9">delivers to pod</text>

  <text x="700" y="372" font-size="12" fill="#64748b">keys · encryption · rotation — all in kernel</text>

  <!-- cilium-agent setup (dashed control) -->
  <line x1="800" y1="200" x2="800" y2="244" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <text x="814" y="226" font-size="11.5" fill="#6d28d9">loads eBPF · keys</text>

  <!-- Step 4: wg0 to eBPF -->
  <line x1="884" y1="316" x2="904" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="894" cy="316" r="11" fill="#8b5cf6"/>
  <text x="894" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>

  <!-- Step 5: kernel to pod -->
  <line x1="1035" y1="246" x2="1035" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1035" cy="224" r="11" fill="#10b981"/>
  <text x="1035" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="1021" y="228" text-anchor="end" font-size="11.5" fill="#475569">delivers to pod</text>

  <!-- Tunnel (drawn last so node 2 fills cannot cover it) -->
  <line x1="460" y1="316" x2="700" y2="316" stroke="#475569" stroke-width="2"/>
  <circle cx="580" cy="316" r="11" fill="#e11d48"/>
  <text x="580" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="580" y="340" text-anchor="middle" font-size="11.5" fill="#475569">encrypted in transit</text>

  <!-- ================= LEGEND ================= -->
  <g font-size="11.5" fill="#475569">
    <circle cx="40" cy="529" r="11" fill="#0284c7"/>
    <text x="40" y="533" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="59" y="533">packet to remote pod</text>

    <circle cx="200" cy="529" r="11" fill="#8b5cf6"/>
    <text x="200" y="533" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="219" y="533">eBPF routes to wg0</text>

    <circle cx="350" cy="529" r="11" fill="#e11d48"/>
    <text x="350" y="533" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="369" y="533">kernel encrypts · in transit</text>

    <circle cx="540" cy="529" r="11" fill="#8b5cf6"/>
    <text x="540" y="533" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <text x="559" y="533">kernel decrypts in wg0</text>

    <circle cx="706" cy="529" r="11" fill="#10b981"/>
    <text x="706" y="533" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <text x="725" y="533">delivery to pod</text>

    <line x1="835" y1="529" x2="857" y2="529" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
    <text x="867" y="533">agent setup</text>

    <text x="1120" y="533" fill="#64748b" text-anchor="end">no userspace per-packet work</text>
  </g>
</svg>
