<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420"
     font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="vxl-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="420" fill="#ffffff"/>
  <text x="580" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">VXLAN Encapsulation — Pod to Pod Across Nodes</text>
  <text x="580" y="64" text-anchor="middle" font-size="14" fill="#475569">pod packet wrapped in UDP 8472 · outer header carries node IPs · inner header keeps pod IPs · rides the Docker bridge</text>

  <!-- NETWORK PATH (gap between hosts) -->
  <text x="580" y="140" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">DOCKER BRIDGE · 172.18.0.0/16 · L2 UNDERLAY</text>

  <!-- NODE PANEL: basic-worker (green = compute) -->
  <rect x="40" y="150" width="340" height="208" rx="12"
        fill="#ecfdf5" stroke="#10b981" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="210" y="178" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">node: basic-worker <tspan fill="#10b981" font-size="11">· 172.18.0.y</tspan></text>

  <rect x="56" y="190" width="308" height="48" rx="8"
        fill="#d1fae5" stroke="#10b981" stroke-opacity="0.45"/>
  <text x="72" y="212" font-size="13" font-weight="700" fill="#047857">pod A <tspan fill="#10b981" font-size="11">· 10.244.1.5</tspan></text>
  <text x="72" y="230" font-size="11.5" fill="#475569">source of the packet · attached to cilium_net</text>

  <rect x="56" y="262" width="308" height="76" rx="8"
        fill="#d1fae5" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="72" y="286" font-size="13" font-weight="700" fill="#047857">cilium_vxlan (encapsulate) <tspan fill="#10b981" font-size="11">· UDP :8472</tspan></text>
  <text x="72" y="308" font-size="11.5" fill="#475569">outer: 172.18.0.y → 172.18.0.z · UDP + VXLAN header</text>
  <text x="72" y="330" font-size="11.5" fill="#475569">inner: 10.244.1.5 → 10.244.2.7 · original pod frame</text>

  <!-- NODE PANEL: basic-worker2 -->
  <rect x="780" y="150" width="340" height="208" rx="12"
        fill="#ecfdf5" stroke="#10b981" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="950" y="178" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">node: basic-worker2 <tspan fill="#10b981" font-size="11">· 172.18.0.z</tspan></text>

  <rect x="796" y="190" width="308" height="48" rx="8"
        fill="#d1fae5" stroke="#10b981" stroke-opacity="0.45"/>
  <text x="812" y="212" font-size="13" font-weight="700" fill="#047857">pod B <tspan fill="#10b981" font-size="11">· 10.244.2.7</tspan></text>
  <text x="812" y="230" font-size="11.5" fill="#475569">destination · receives the inner pod frame</text>

  <rect x="796" y="262" width="308" height="76" rx="8"
        fill="#d1fae5" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="812" y="286" font-size="13" font-weight="700" fill="#047857">cilium_vxlan (decapsulate) <tspan fill="#10b981" font-size="11">· UDP :8472</tspan></text>
  <text x="812" y="308" font-size="11.5" fill="#475569">strip outer header (node IPs, UDP, VNI)</text>
  <text x="812" y="330" font-size="11.5" fill="#475569">deliver inner packet to pod B via cilium_net</text>

  <!-- FLOW ARROWS (drawn last; one per step) -->
  <line x1="210" y1="242" x2="210" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#vxl-arrow)"/>
  <circle cx="210" cy="249" r="11" fill="#0284c7"/>
  <text x="210" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="224" y="253" font-size="11.5" fill="#475569">send packet</text>

  <line x1="384" y1="300" x2="773" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#vxl-arrow)"/>
  <text x="560" y="290" text-anchor="end" font-size="11.5" fill="#475569">VXLAN packet · UDP 8472</text>
  <circle cx="580" cy="300" r="11" fill="#d97706"/>
  <text x="580" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>

  <line x1="950" y1="258" x2="950" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#vxl-arrow)"/>
  <circle cx="950" cy="251" r="11" fill="#e11d48"/>
  <text x="950" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="964" y="255" font-size="11.5" fill="#475569">deliver</text>

  <!-- LEGEND (badge bottom 400, 20 px above the canvas bottom) -->
  <g font-size="11.5" fill="#475569">
    <circle cx="70" cy="389" r="11" fill="#0284c7"/><text x="70" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text><text x="89" y="393">pod A sends</text>
    <circle cx="220" cy="389" r="11" fill="#d97706"/><text x="220" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text><text x="239" y="393">VXLAN over Docker bridge</text>
    <circle cx="460" cy="389" r="11" fill="#e11d48"/><text x="460" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text><text x="479" y="393">deliver to pod B</text>
    <text x="1120" y="393" fill="#64748b" text-anchor="end">outer: 172.18.0.0/16 (Docker bridge) · inner: pod CIDRs · UDP 8472</text>
  </g>
</svg>
